[project]
name = "qwen-one-two"
version = "0.2.0"
description = "Qwen with learned internal Qev invocation and continuous thinking budgets"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "torch>=2.6",
  "transformers>=5.0",
  "safetensors>=0.5",
  "accelerate>=1.4",
  "peft==0.21.0",
  "flash-linear-attention>=0.6.0",
]

[project.scripts]
qwen-one-two = "qwen_one_two.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_one_two"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "qwen_one_two/static"
"licenses" = "qwen_one_two/licenses"
